name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck unzip
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Lint
        run: shellcheck savesync.sh tests/test.sh
      - name: Test
        run: tests/test.sh
